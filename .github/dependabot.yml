version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    # Framework (codeigniter4/framework) adalah dependensi dengan permukaan
    # keamanan terbesar — notifikasi versi baru penting untuk di-review cepat.
    allow:
      - dependency-name: "codeigniter4/*"
      - dependency-type: "direct"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
