name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: PHPUnit (Unit suite) - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, gd, sqlite3, mysqli, curl, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Fail-fast bila dependensi produksi memiliki advisory CVE aktif.
      - name: Audit dependencies (CVE)
        run: composer audit --no-dev --no-interaction

      - name: Lint PHP
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      # Suite Unit tidak butuh MySQL/server live; suite Database & Live
      # dijalankan manual di lingkungan yang menyediakan db_newtiket/db_ult.
      - name: Run unit suite
        run: vendor/bin/phpunit --no-coverage --testsuite Unit
